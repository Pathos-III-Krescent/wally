services:
  wally-backend:
    image: ghcr.io/pathos-iii-krescent/wally:latest
    environment:
      - WALLY_auth=${WALLY_auth}
      - WALLY_github_token=${WALLY_github_token}
      - WALLY_ci_publish_key=${WALLY_ci_publish_key:-}
      - WALLY_legacy_api_key=${WALLY_legacy_api_key:-}
      - WALLY_audit_webhook=${WALLY_audit_webhook:-}
      - WALLY_audit_log_path=/app/audit/audit.log
    volumes:
      - packages:/app/packages
      - audit:/app/audit
    networks:
      - traefik
    deploy:
      labels:
        traefik.enable: "true"
        traefik.http.routers.wally.rule: "Host(`wally.pathos.gg`)"
        traefik.http.services.wally.loadbalancer.server.port: 8000

networks:
  traefik:
    external: true

volumes:
  packages:
  audit:
